# Render Blueprint — disaster-recovery / one-click redeploy.
# Render builds from ./Dockerfile (honors $PORT) and health-checks /health. No secrets here:
# every key is `sync: false` (Render prompts in the dashboard).
# To run on Render free (512MB) without OOM, keep torch off-box: leave USE_LOCAL_EMBEDDER unset
# and instead point INFERENCE_MODE=remote + EMBEDDING_ENDPOINT at any remote embedding host
# implementing the generic {"texts":[...]} -> {"embeddings":[...]} contract (see .env.example).
#
# DEFECT-08 fix: added all missing env vars so a blueprint redeploy matches production:
#   GEMINI_API_KEY, OPENAI_API_KEY, RAGEVAL_POSTGRES_URL, RAGEVAL_STORE, GOOGLE_API_KEY.
services:
  - type: web
    name: rageval
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: false
    envVars:
      # ── LLM judge keys ──────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY          # required for gemini/gemini-flash-latest judge
        sync: false
      - key: GOOGLE_API_KEY          # alias used by some google-genai SDK versions
        sync: false
      - key: OPENAI_API_KEY          # required for openai/gpt-4o-mini judge (3rd judge)
        sync: false

      # ── Judge & embedding config ────────────────────────────────────────────
      - key: JUDGE_MODELS            # comma-separated list, e.g. anthropic/claude-haiku-4-5,groq/llama-3.3-70b-versatile,gemini/gemini-flash-latest
        sync: false
      - key: INFERENCE_MODE          # "remote" to use EMBEDDING_ENDPOINT instead of loading a model in-process
        sync: false
      - key: EMBEDDING_ENDPOINT      # generic remote embedding host — see .env.example
        sync: false
      - key: INFERENCE_TOKEN
        sync: false

      # ── Database ────────────────────────────────────────────────────────────
      - key: RAGEVAL_POSTGRES_URL    # Neon/Supabase/PG connection string with pgvector
        sync: false
      - key: RAGEVAL_STORE           # "postgres" | "sqlite" (default: sqlite on free tier)
        sync: false
      - key: RAGEVAL_DB_PATH         # path to SQLite file when RAGEVAL_STORE=sqlite
        sync: false

      # ── Auth & CORS ─────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OMNIINTEL_INTERNAL_TOKEN  # REQUIRED: must match gateway
        sync: false
      - key: REQUIRE_INTERNAL_TOKEN
        value: "true"

      # ── Misc ────────────────────────────────────────────────────────────────
      - key: ENVIRONMENT             # "production" | "development"
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
