# Lightweight dev compose for RAGeval — meant for a remote dev host (any on-demand
# cloud box, a home server, etc.) — not just a local machine.
# Uses SQLite by default (no database server needed).
# BGE-large model (~1.3 GB) downloads on first use and caches in named volume.
#
# Usage on the remote host:
#   docker compose -f docker-compose.dev.yml up --build
#
# Reach it from your laptop: ssh -L 8003:localhost:8003 <your-remote-host>
# Then: http://localhost:8003/health

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rageval:dev
    volumes:
      # api.py puts /app/src on sys.path — mount over /app/src/rageval so the
      # live-edit mount actually shadows the image's copy (./rageval doesn't exist).
      - ./src/rageval:/app/src/rageval
      - ./core:/app/core
      - ./api.py:/app/api.py
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - rageval_db:/app/data
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      RAGEVAL_STORE: sqlite
      RAGEVAL_DB_PATH: /app/data/rageval.db
    command: >
      uvicorn api:app
      --host 0.0.0.0
      --port 8003
      --reload
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim has no curl — probe /health with urllib instead.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  rageval_db:
  hf_cache:
    # Persists BGE-large and other HuggingFace model downloads
