name: _Temp Render Env Probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List configured env var keys (no values)
        run: |
          curl -fsS "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            | python3 -c "import sys,json; [print(i['envVar']['key']) for i in json.load(sys.stdin)]"
