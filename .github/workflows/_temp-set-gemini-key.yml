name: _Temp Set Gemini Key

on:
  workflow_dispatch: {}

jobs:
  set-key:
    runs-on: ubuntu-latest
    steps:
      - name: Update GEMINI_API_KEY on Render
        run: |
          code=$(curl -fsS -o /tmp/resp.json -w "%{http_code}" \
            -X PUT "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars/GEMINI_API_KEY" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"value\":\"${{ secrets.TEMP_NEW_GEMINI_KEY }}\"}") || { echo "update failed"; exit 1; }
          echo "Render responded HTTP $code"
          cat /tmp/resp.json
