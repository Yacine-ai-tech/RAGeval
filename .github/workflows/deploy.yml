name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  render:
    name: "Trigger Render deploy"
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_DEPLOY_ENABLED != 'false' }}
    steps:
      - name: Trigger deploy
        run: |
          if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ] || [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "RENDER_SERVICE_ID/RENDER_API_KEY not configured — skipping."
            exit 0
          fi
          code=$(curl -fsS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}') || { echo "deploy trigger failed"; exit 1; }
          echo "Render responded HTTP $code"
          cat /tmp/resp.json
